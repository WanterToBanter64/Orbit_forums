<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

:root[data-theme="dark"]{--bg:#16121e;--sf:#1f1a2b;--ink:#efeaf7;--mu:#9a90ab;--ln:#342c46;--ac:#a78bfa;--ac2:#2b2240;--ai:#1a1030}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Orbit','Trebuchet MS',system-ui,sans-serif;overflow:hidden}

#app{display:flex;height:100%}

.brand{font-size:19px;font-weight:700;padding:4px 10px 14px;display:flex;gap:8px;align-items:center}.brand b{color:var(--ac);font-size:26px}
.nav{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px}

.lab{font-size:11px;letter-spacing:.1em;color:var(--mu);padding:12px 10px 4px;text-transform:uppercase}
.sp{flex:1}.me{border:1px solid var(--ln);justify-content:flex-start}
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--ln);background:var(--sf)}
.top h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live{font-size:12px;color:var(--ok)}.burger{display:none}

.feed{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px}
.card.link{cursor:pointer}.card.link:hover{border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.big{font-size:30px}.mu{color:var(--mu);font-size:13px}
.note{background:var(--ac2);color:var(--ac);border-radius:14px;padding:12px 16px;font-weight:700}
.msg{display:flex;gap:10px}.av{width:38px;height:38px;border-radius:50%;background:var(--ac2);display:grid;place-items:center;font-size:21px;flex:none}

.row{display:flex;gap:8px;align-items:flex-end}
textarea,input[type=text],input[type=password]{width:100%;border:1px solid var(--ln);background:var(--bg);border-radius:14px;padding:10px 12px;outline:none;resize:none}
textarea:focus,input:focus{border-color:var(--ac)}
.ib{border:1px solid var(--ln);background:var(--bg);border-radius:12px;width:42px;height:42px;font-size:19px;flex:none}
.btn{background:var(--ac);color:var(--ai);border:0;border-radius:12px;padding:10px 18px;font-weight:700}.btn.g{background:var(--ac2);color:var(--ac)}.btn.r{background:var(--rd);color:#fff}
.chip{background:var(--ac2);color:var(--ac);border-radius:99px;padding:3px 10px;font-size:13px;display:inline-block;margin-bottom:6px}
#emo{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:min(340px,92vw);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px;display:flex;flex-wrap:wrap;gap:2px;box-shadow:0 8px 30px #0003;z-index:30}
#emo[hidden]{display:none}#emo button{border:0;background:none;font-size:24px;border-radius:8px;padding:2px 5px}#emo button:hover{background:var(--ac2)}
#modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:20;padding:16px}#modal[hidden]{display:none}
.dlg{background:var(--sf);border-radius:20px;padding:20px;width:min(480px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}

.er{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ln);padding:6px 0}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:40;font-size:13px}#toast:empty{display:none}
body{background:var(--bgi,var(--bg))}.feed>*{width:100%;max-width:780px;margin-left:auto;margin-right:auto}
.card{border-radius:8px}.card.link:hover{border-color:var(--ink)}
.rt{display:flex;gap:8px;align-items:stretch}.rt .card{flex:1;min-width:0}

.pic{cursor:zoom-in}.pic.s{max-width:110px;max-height:110px}.pic.l{max-width:100%;max-height:none}
.bd a{color:var(--ac);text-decoration:underline}.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
select{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:8px;flex:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.aero aside,.aero .top,.aero .card,.aero .comp,.aero .dlg{backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 #fff9,0 4px 18px #0a4a7a22}.aero .btn{background:linear-gradient(#5fd0ff,#1a8fe0)}
html{scroll-behavior:smooth}.feed{scroll-behavior:smooth;scroll-padding:12px}
body,aside,.top,.card,.comp,.dlg,.btn,.nav,.ib{transition:background-color .35s,color .35s,border-color .35s,transform .2s,box-shadow .2s}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.98)}}@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}}@keyframes fade{from{opacity:0}}@keyframes sh{to{background-position:-200% 0}}@keyframes grad{50%{background-position:100% 50%}}
.feed.anim>*{animation:in .5s cubic-bezier(.2,.8,.2,1) both}.feed.anim>:nth-child(2){animation-delay:.06s}.feed.anim>:nth-child(3){animation-delay:.12s}.feed.anim>:nth-child(n+4){animation-delay:.18s}
.dlg{animation:pop .28s cubic-bezier(.2,.8,.2,1)}#modal{animation:fade .2s}#toast{animation:in .3s}
.card.link:hover{transform:translateY(-2px);box-shadow:0 8px 22px #0002}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px #0003}
.btn:active,.ib:active,.vt button:active,.tab:active{transform:scale(.94)}.nav:hover{transform:translateX(3px)}.vt button:hover{color:var(--ac);transform:scale(1.35)}
.hero{background:linear-gradient(120deg,var(--ac),#c084fc,var(--ac));background-size:200% 200%;animation:grad 9s ease infinite;color:var(--ai);border-radius:14px;padding:22px}
.stats{display:flex;gap:26px;margin-top:12px;flex-wrap:wrap}.stats b{font-size:28px;display:block}
.sk{height:72px;border-radius:8px;background:linear-gradient(90deg,var(--ac2) 25%,var(--sf) 50%,var(--ac2) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pills button{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 14px;font-size:13px}.pills .on{background:var(--ac);color:var(--ai);border-color:var(--ac)}
.srch{max-width:220px;border-radius:99px;padding:8px 14px}.av.sm{width:28px;height:28px;font-size:16px;flex:none}
.mn{color:var(--ac);font-weight:700;background:var(--ac2);border-radius:6px;padding:0 4px}code{background:var(--ac2);padding:1px 5px;border-radius:5px}
#cm{position:fixed;inset:0;background:#0006;display:grid;place-items:center;z-index:25;padding:16px}#cm[hidden]{display:none}
.lk{cursor:pointer}.lk:hover{text-decoration:underline}.mh .x{opacity:.7;font-size:15px}
.calm *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
#tr{position:fixed;inset:0;pointer-events:none;z-index:6}.dlg.wide{width:min(780px,100%)}.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.acts .btn{padding:5px 10px;font-size:12px}
@keyframes drift{to{transform:translate(4%,3%) scale(1.15)}}@keyframes spin{to{transform:rotate(360deg)}}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 18% 22%,var(--ac2),transparent 42%),radial-gradient(circle at 82% 72%,var(--ac2),transparent 46%);animation:drift 22s ease-in-out infinite alternate}
.brand b{display:inline-block;animation:spin 16s linear infinite}.card{box-shadow:0 1px 3px #0001}
.feed::-webkit-scrollbar{width:8px}.feed::-webkit-scrollbar-thumb{background:var(--ac2);border-radius:9px}.feed::-webkit-scrollbar-thumb:hover{background:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}.msg{transition:background .3s;border-radius:10px}.msg:hover{background:var(--ac2)}
@media(max-width:760px){aside{position:fixed;inset:0 auto 0 0;z-index:15;transform:translateX(-100%);transition:.2s;padding-top:calc(16px + env(safe-area-inset-top,0px))}aside.open{transform:none}.burger{display:block}}
</style></head><body>
<div id="app"><aside id="side"></aside><main id="main"></main></div>
<canvas id="fx"></canvas><canvas id="tr"></canvas><div id="emo" hidden></div><div id="modal" hidden></div><div id="cm" hidden></div><div id="toast"></div><input type="file" id="fi" accept="image/*,.gif" hidden>
<script>
/* ===== Orbit Forums standalone storage layer (replaces claude.ai services) =====
   BACKEND = ''  -> data is saved in this browser only (one device, good for testing).
   BACKEND = 'https://YOUR-PROJECT-default-rtdb.firebaseio.com' -> shared by everyone who opens the site
   (Firebase Realtime Database, free tier). See the setup notes that came with this file. */
const BACKEND='';
(function(){
const BK=BACKEND.replace(/\/$/,''),D={},L={},LS=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const ids=()=>Math.random().toString(36).slice(2,12)+Date.now().toString(36),load=c=>D[c]||(D[c]=LS('of:'+c)||{});
const save=c=>{try{localStorage.setItem('of:'+c,JSON.stringify(D[c]))}catch(e){}},emit=c=>(L[c]||[]).forEach(f=>f());
async function net(m,p,b){const r=await fetch(BK+'/'+p+'.json',{method:m,body:b===undefined?undefined:JSON.stringify(b)});return r.json()}
async function pull(c){if(!BK)return;try{D[c]=(await net('GET',c))||{};save(c);emit(c)}catch(e){}}
async function W(c,id,d,merge){const o=load(c);o[id]=merge?{...(o[id]||{}),...d}:d;save(c);emit(c);if(BK)await net(merge?'PATCH':'PUT',c+'/'+id,d)}
async function X(c,id){delete load(c)[id];save(c);emit(c);if(BK)await net('DELETE',c+'/'+id)}
const sub=(c,run)=>{(L[c]=L[c]||[]).push(run);if(BK)pull(c);setTimeout(run,0);return()=>{}};
const Q=(c,o)=>({orderBy:(f,d)=>Q(c,{...o,f,d}),limit:n=>Q(c,{...o,n}),
 onSnapshot(cb){return sub(c,()=>{let a=Object.entries(load(c)).map(([id,v])=>({id,data:()=>v}));if(o.f)a.sort((x,y)=>((x.data()[o.f]>y.data()[o.f])?1:-1)*(o.d=='desc'?-1:1));if(o.n)a=a.slice(0,o.n);cb({docs:a})})},
 async add(d){const id=ids();await W(c,id,d);return{id}}});
const db={collection:c=>Q(c,{}),doc:p=>{const[c,id]=p.split('/');return{
 async get(){if(BK){try{const v=await net('GET',c+'/'+id);if(v)load(c)[id]=v;else delete load(c)[id]}catch(e){}}const v=load(c)[id];return{exists:!!v,data:()=>v}},
 set:d=>W(c,id,d),update:d=>W(c,id,d,1),delete:()=>X(c,id),
 onSnapshot(cb){return sub(c,()=>{const v=load(c)[id];cb({exists:!!v,data:()=>v})})}}}};
function shrink(f){return new Promise((ok,no)=>{if(f.type=='image/gif'){if(f.size>250e3)return no(new Error('GIF is over 250 KB'));const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f);return}
 const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=no;i.src=URL.createObjectURL(f)})}
let dev=LS('of:device');if(!dev){dev='dev_'+ids();try{localStorage.setItem('of:device',JSON.stringify(dev))}catch(e){}}
const svc={db,assets:{upload:async f=>({url:await shrink(f)})},user:{id:async()=>dev,canEdit:()=>true,me:async()=>({name:''})}};
window.claude={use:async n=>svc[n]};
addEventListener('storage',e=>{if(e.key&&e.key.startsWith('of:')&&e.key!='of:device'){const c=e.key.slice(3);D[c]=LS(e.key)||{};emit(c)}});
if(BK)setInterval(()=>Object.keys(L).forEach(pull),2500);
})();
</script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EM='😀 😂 🤣 😊 😍 🥰 😎 🤩 🥳 😭 😅 🤔 😴 😡 🙄 😱 👍 👎 👏 🙌 🙏 💪 🔥 ✨ ⭐ 💯 ❤️ 💜 💙 🎉 🎓 📚 ✏️ 🧠 🏀 ⚽ 🎮 🎵 🎨 🍕 🍔 🐱 🐶 🦄 🌈 ☕ 🚀'.split(' ');
const AV='🦊 🐼 🐸 🦉 🐙 🦄 🐯 🐧 🐢 🦁 🐨 🐝 🦋 🐬 🦖 🐳'.split(' ');
const S={cats:[],th:[],msgs:[],chat:[],mem:{},ban:{},cfg:{},votes:[]},V={cat:null,th:null,tab:'t'};
let db,user,assets,P=null,TA=null,PA='',AM=0,FXr=0,ME={id:null,admin:false,can:false},ready=false,asked=false;
const T=t=>new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const nm=i=>(S.mem[i]&&S.mem[i].nick)||'Student',av=i=>{const a=(S.mem[i]&&S.mem[i].av)||'';return /^(\/_blob\/|https?:|data:image\/)/.test(a)?`<img src="${esc(a)}" alt="">`:(a||'🙂')},cat=i=>S.cats.find(c=>c.id==i),thr=i=>S.th.find(t=>t.id==i);
const banned=()=>{const b=S.ban[ME.id];return !!b&&(!b.until||b.until>Date.now())},body=b=>esc(b).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener noreferrer nofollow">$1</a>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/(^|\s)@([\w.]+)/g,'$1<span class="mn">@$2</span>').replace(/\n/g,'<br>');
function toast(t){const e=$('#toast');e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>e.textContent='',2200)}
function modal(h){AO=0;if(!h)AM=0;const m=$('#modal');m.innerHTML=h?`<div class="dlg">${h}</div>`:'';m.hidden=!h}
function sub(q,fn){q.onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));upd()},e=>console.error(e))}
/* ---------- views ---------- */
function side(){
 $('#side').innerHTML=`<div class="brand"><b>✺</b>Orbit Forums</div>
 <button class="nav ${!V.cat?'on':''}" data-a="go">🏠 Home</button><button class="nav" data-a="mem">👥 Members</button><div class="lab">Forums</div>
 ${S.cats.map(c=>`<button class="nav ${V.cat==c.id?'on':''}" data-a="go" data-c="${esc(c.id)}">${esc(c.emoji)} r/${esc(String(c.name).replace(/\s+/g,''))}</button>`).join('')||'<div class="mu" style="padding:0 10px">No forums yet</div>'}
 <div class="sp"></div><button class="nav" data-a="set">⚙ Settings</button>${ME.can?'<button class="nav" data-a="adm">🛡 '+(ME.admin?'Admin controls':'Admin login')+'</button>':''}
 ${ME.id?`<button class="nav me" data-a="prof"><span class="av sm">${av(ME.id)}</span> ${esc(nm(ME.id))}</button>`:'<button class="nav me" data-a="auth">🔑 Log in / Sign up</button>'}`}
function main(){
 const c=cat(V.cat),t=thr(V.th);let title='Welcome to Orbit Forums ✺',tabs='',comp='';
 if(c){title=c.emoji+' r/'+String(c.name).replace(/\s+/g,'');if(!t)tabs=`<div class="tabs"><button class="tab ${V.tab=='t'?'on':''}" data-a="tab" data-t="t">💬 Threads</button><button class="tab ${V.tab=='c'?'on':''}" data-a="tab" data-t="c">⚡ Live chat</button></div>`}
 if(t)title=t.title;
 if(t||(c&&V.tab=='c'))comp=composer(t?'reply':'chat',t);
 $('#main').innerHTML=`<div class="top"><button class="ib burger" data-a="burger">☰</button>${t?'<button class="ib" data-a="go" data-c="'+esc(V.cat)+'">←</button>':''}<h2>${esc(title)}</h2>
 ${t&&ME.admin?`<button class="btn g" data-a="pin">${t.pin?'Unpin':'📌 Pin'}</button><button class="btn g" data-a="lock">${t.lock?'Unlock':'🔒 Lock'}</button>`:''}
 ${c&&!t&&V.tab=='t'?'<button class="btn" data-a="nt">＋ New thread</button>':''}<input type="text" id="q" class="srch" placeholder="🔍 Search  ( / )" value="${esc(Q)}"><span class="live">${ready?'● Live':''}</span></div>${tabs}<div class="feed" id="feed"></div><div id="compw">${comp}</div>`;
 V.fresh=1;feed()}
function composer(kind,t){
 if(!ME.id)return'<div class="comp"><div class="note">Log in to join the conversation. <button class="btn" data-a="auth">Log in / Sign up</button></div></div>';
 if(banned())return'<div class="comp"><div class="note">${bmsg()}</div></div>';
 if(t&&t.lock&&!ME.admin)return'<div class="comp"><div class="note">🔒 This thread is locked.</div></div>';
 return`<div class="comp"><span class="chipw"></span><div class="row"><button class="ib" data-a="emo">😊</button>${assets?'<button class="ib" data-a="att" title="Image or GIF">🖼</button>':''}<textarea id="ta" rows="1" placeholder="${kind=='chat'?'Message the live chat…':'Write a reply…'}"></textarea><button class="btn" data-a="send" data-k="${kind}">Send</button></div></div>`}
function msg(m,k){const mine=m.a==ME.id;
 return`<div class="msg"><div class="av lk" data-a="pf" data-u="${esc(m.a)}">${av(m.a)}</div><div class="mb"><div class="mh"><b class="lk" data-a="pf" data-u="${esc(m.a)}">${esc(nm(m.a))}</b>${m.adm?'<i class="bdg">ADMIN</i>':''}<span title="${T(m.ts)}">${ago(m.ts)} · ${T(m.ts)}${m.ed?' · edited '+ago(m.ed):''}</span>
 ${ME.admin||mine?`<button class="x" data-a="edit" data-k="${k}" data-i="${esc(m.id)}" title="Edit">✏️</button><button class="x" data-a="del" data-k="${k}" data-i="${esc(m.id)}" title="Delete">🗑</button>`:''}${ME.admin&&m.img?`<button class="x" data-a="dimg" data-k="${k}" data-i="${esc(m.id)}" title="Delete image only">🖼</button>`:''}${ME.admin&&!mine?`<button class="x" data-a="mq" data-u="${esc(m.a)}" title="Moderate user">🚫</button>`:''}</div>
 <div class="bd">${body(m.body)}</div>${m.img?`<img class="pic ${esc(m.sz||'')}" data-a="rs" src="${esc(m.img)}" alt="attachment">`:''}</div></div>`}
function feed(){
